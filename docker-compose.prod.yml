# 阿里云 ECS 单机部署：只运行应用容器（镜像来自阿里云 ACR），不在这里 build。
# 数据库复用服务器上已有的 postgres 容器（独立数据库 seki_portfolio），
# 通过外部网络 touhou-trpg_default 以容器名互访。
services:
  app:
    image: ${APP_IMAGE:?请在 .env 中设置 APP_IMAGE}
    container_name: seki-portfolio-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "8080:8080"
    # 单机 1.6G 内存，限制资源避免影响同机的 touhou-trpg / n8n / postgres。
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 256
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trpg

networks:
  trpg:
    external: true
    name: touhou-trpg_default
