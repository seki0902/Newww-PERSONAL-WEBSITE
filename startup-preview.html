<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEKI OS · 启动动画预览</title>
  <style>
    :root { color-scheme: dark; font-family: "Courier New", "Microsoft YaHei", monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #102949; }
    button { font: inherit; }
    .boot, .desktop { position: fixed; inset: 0; overflow: hidden; }
    .boot { isolation: isolate; color: #fff; image-rendering: pixelated; transition: opacity .42s ease, transform .42s ease; }
    .boot.leave { opacity: 0; transform: scale(1.035); pointer-events: none; }
    .sky { position: absolute; inset: 0; background: linear-gradient(180deg,#071527 0%,#15314f 50%,#2d5270 100%); }
    .sky::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg,#113762 0%,#315f88 50%,#547c93 100%); opacity: 0; animation: dawn 4s ease-out forwards; }
    .sky::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 58%,#5082a361,transparent 60%); }
    .scene { position: absolute; inset: 0; width: 100%; height: 100%; background: url('./public/assets/canva-original/MAHV_jjXGNM.png') center / 100% 100% no-repeat; }
    .original-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .scene > div { position: absolute; inset: 0; background-image: url("./canva-loading-reference.png"); background-size: 100% 100%; background-repeat: no-repeat; }
    .stars-canopy { clip-path: polygon(0 0,100% 0,100% 27%,0 27%); mask-image: linear-gradient(to bottom,#000 0 65%,transparent 100%); }
    .left-bank { clip-path: polygon(0 54%,39% 54%,39% 75%,0 75%); }
    .right-bank { clip-path: polygon(63% 54%,100% 54%,100% 75%,63% 75%); }
    .lake-and-meadow { clip-path: polygon(0 74%,100% 74%,100% 100%,0 100%); }
    .center-clean { position: absolute; inset: 19% 25% 23%; background: linear-gradient(180deg,#1b4169,#285475 75%,#285475); mask-image: radial-gradient(ellipse 52% 52% at center,#000 68%,transparent 100%); }
    .mid-mountain { position: absolute; left: 35%; top: 53%; width: 34%; height: 22%; background: linear-gradient(180deg,#547793,#234969); clip-path: polygon(0 100%,0 69%,12% 46%,20% 62%,37% 18%,49% 48%,60% 32%,73% 58%,85% 41%,100% 70%,100% 100%); mask-image: radial-gradient(ellipse 70% 70% at 50% 30%,#000 45%,transparent 100%); opacity: .83; }
    .mid-mountain.front { top: 59%; height: 16%; background: linear-gradient(180deg,#315b7c,#1f4563); clip-path: polygon(0 100%,0 48%,14% 66%,28% 29%,42% 55%,58% 22%,69% 55%,84% 35%,100% 64%,100% 100%); }
    .dawn-shade { position: absolute; inset: 0; background: #04162b; opacity: .52; pointer-events: none; animation: shade-lift 4s ease-out forwards; }
    .cloud { position: absolute; inset: 0; background: url('./public/assets/canva-original/MAHV_jjXGNM.png') center / 100% 100% no-repeat; pointer-events: none; }
    .cloud.left { mask-image: radial-gradient(ellipse 23% 21% at 18% 44%,#000 50%,transparent 100%); animation: cloud-left 8s ease-in-out infinite alternate; }
    .cloud.right { mask-image: radial-gradient(ellipse 25% 23% at 88% 40%,#000 50%,transparent 100%); animation: cloud-right 10s ease-in-out infinite alternate; }
    .cat-body { position: absolute; inset: 0; background: url("./canva-loading-reference.png") center / 100% 100% no-repeat; clip-path: polygon(45.7% 23.3%,47.2% 22.8%,47.8% 25%,50.3% 25%,51.4% 22.8%,52.6% 23.3%,53.2% 28%,53.4% 33%,52% 34.4%,47% 34.2%,45.6% 31%); filter: drop-shadow(0 2px #172c42); }
    .cat-tail { transform-origin: 0 0; animation: tail 1.4s ease-in-out infinite alternate; }
    .twinkle { position: absolute; width: .32vw; min-width: 3px; aspect-ratio: 1; background: #fff0ba; box-shadow: 0 0 9px 3px #ffdc8d88; transform: rotate(45deg); animation: twinkle 1.8s ease-in-out infinite alternate; }
    .twinkle.a { left: 42%; top: 26%; } .twinkle.b { left: 57%; top: 27%; animation-delay: .55s; }
    .ui { position: absolute; z-index: 4; top: 36.2%; left: 50%; width: min(42%, 340px); transform: translateX(-50%); text-align: center; text-shadow: 2px 2px 0 #20364a, 0 2px 8px #0a1836; }
    .logo { margin: 0; font-size: clamp(20px,3.35vw,48px); line-height: 1; font-weight: 900; letter-spacing: -.065em; }
    .slogan { position: relative; height: 1.8em; margin-top: .18em; font-size: clamp(10px,1.72vw,23px); font-weight: 800; letter-spacing: -.04em; }
    .slogan span { position: absolute; inset: 0; white-space: nowrap; transition: opacity .38s ease; }
    .slogan .zh { opacity: 0; } .slogan.switched .en { opacity: 0; } .slogan.switched .zh { opacity: 1; }
    .progress { position: relative; width: 78%; height: clamp(7px,1.15vw,16px); margin: 3.3% auto 0; overflow: visible; border: 2px solid #54809b; border-radius: 999px; background: #163b58; box-shadow: 0 0 0 1px #15334c, inset 0 2px 4px #09233e; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg,#64d9f0,#8de9f5); box-shadow: 0 0 8px #7ee7f8a6; }
    .progress-star { position: absolute; top: 50%; left: 0; width: clamp(8px,1.2vw,16px); aspect-ratio: 1; background: #fff5c8; clip-path: polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%); transform: translate(-50%,-50%); filter: drop-shadow(0 0 5px #ffe6a3); }
    .status { margin: 1.5% 0 0; font-size: clamp(9px,1.45vw,19px); font-weight: 800; }
    .welcome { margin: .55% 0 0; font-size: clamp(7px,1.1vw,14px); line-height: 1.55; font-weight: 700; }
    .desktop { display: grid; place-items: center; opacity: 0; pointer-events: none; background: #ffd5e6 url("./public/content/current/assets/images/pink-desktop.svg") center / cover no-repeat; transition: opacity .42s ease; color: #753257; }
    .desktop.show { opacity: 1; pointer-events: auto; }
    .desktop-card { padding: 1rem 1.5rem; border: 2px solid #fff; border-radius: 12px; background: #fff9; box-shadow: 0 6px 0 #ef8db6; text-align: center; }
    .desktop-card strong { display: block; font-size: clamp(18px,3vw,32px); }
    .desktop-card small { display: block; margin-top: .4rem; }
    .replay { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 10; border: 1px solid #ffffff9c; border-radius: 8px; padding: .5rem .8rem; color: white; background: #0c274bbd; cursor: pointer; }
    .replay:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    @keyframes dawn { to { opacity: 1; } }
    @keyframes shade-lift { to { opacity: 0; } }
    @keyframes cloud-left { to { transform: translateX(1.3%); } }
    @keyframes cloud-right { to { transform: translateX(-1.8%); } }
    @keyframes tail { to { transform: rotate(-10deg) translateY(-1px); } }
    @keyframes twinkle { to { opacity: .4; transform: rotate(45deg) scale(.6); } }
    @media (max-aspect-ratio: 1/1) { .scene, .cloud, .cat-body { width: 178vh; height: 100%; left: 50%; transform: translateX(-50%); } .cloud.left { animation-name: cloud-left-mobile; } .cloud.right { animation-name: cloud-right-mobile; } .cat-tail { left: 54%; } .ui { top: 38%; width: min(78%,340px); } .logo { font-size: clamp(26px,7vw,42px); } .slogan { font-size: clamp(12px,3vw,18px); } .status { font-size: 12px; } .welcome { font-size: 10px; } @keyframes cloud-left-mobile { to { transform: translateX(calc(-50% + 8px)); } } @keyframes cloud-right-mobile { to { transform: translateX(calc(-50% - 11px)); } } }
    @media (prefers-reduced-motion: reduce) { .cloud,.cat-tail,.twinkle,.sky::before,.dawn-shade { animation: none; } .boot,.desktop,.slogan span { transition-duration: .01ms; } }
  </style>
</head>
<body>
  <main class="boot" id="boot" aria-label="SEKI OS 系统启动中">
    <div class="sky" aria-hidden="true"></div>
    <div class="scene" aria-hidden="true"></div>
    <div class="cloud left" aria-hidden="true"></div><div class="cloud right" aria-hidden="true"></div>
    <svg class="original-layer" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
      <image href="./public/assets/canva-original/MAHV_kZZuSY.png" x="0" y="0" width="239" height="295"/>
      <image href="./public/assets/canva-original/MAHV_mLKkCQ.png" x="238" y="0" width="260" height="157"/>
      <image href="./public/assets/canva-original/MAHV_mFriGQ.png" x="0" y="372" width="20" height="79"/>
      <image href="./public/assets/canva-original/MAHV_lPoNak.png" x="0" y="509" width="140" height="256"/>
      <image href="./public/assets/canva-original/MAHV_iDthYI.png" x="0" y="666" width="518" height="197"/>
      <image href="./public/assets/canva-original/MAHV_pm1j1g.png" x="0" y="784" width="518" height="157"/>
      <image href="./public/assets/canva-original/MAHV_saoD2c.png" x="1313" y="744" width="359" height="197"/>
      <defs><clipPath id="original-cat-body"><rect width="122" height="119"/></clipPath><clipPath id="original-cat-tail"><rect x="118" width="62" height="119"/></clipPath></defs>
      <g transform="translate(756 215)">
        <g transform="translate(120 105)"><g class="cat-tail"><g transform="translate(-120 -105)"><image href="./public/assets/canva-original/MAHV_pfICPo.png" width="180" height="119" clip-path="url(#original-cat-tail)"/></g></g></g>
        <image href="./public/assets/canva-original/MAHV_pfICPo.png" width="180" height="119" clip-path="url(#original-cat-body)"/>
      </g>
    </svg>
    <div class="dawn-shade" aria-hidden="true"></div>
    <i class="twinkle a" aria-hidden="true"></i><i class="twinkle b" aria-hidden="true"></i>
    <section class="ui" aria-live="off"><h1 class="logo">SEKI OS</h1><div class="slogan" id="slogan"><span class="en">Explore. Build. Grow.</span><span class="zh">探索 · 构建 · 成长</span></div><div class="progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="progress-fill" id="fill"></div><div class="progress-star" id="star"></div></div><p class="status" id="status">系统启动中……</p><p class="welcome">欢迎加入【好公司】<br>请准备开始你的入职探索</p></section>
  </main>
  <main class="desktop" id="desktop" aria-hidden="true"><div class="desktop-card"><strong>欢迎，Jenny</strong><small>桌面预览 · 待接入现有前端</small></div></main>
  <button class="replay" id="replay" type="button">重播动画</button>
  <script>
    const points = [[0,0],[330,13],[860,31],[1400,43],[1690,44],[1930,44],[2250,64],[2680,76],[2940,77],[3170,77],[3530,94],[3900,100]];
    const boot = document.getElementById('boot'), desktop = document.getElementById('desktop');
    const fill = document.getElementById('fill'), star = document.getElementById('star');
    const progress = document.getElementById('progress'), slogan = document.getElementById('slogan');
    const status = document.getElementById('status');
    let start = 0, frame = 0;
    function valueAt(time) {
      for (let i = 1; i < points.length; i++) if (time <= points[i][0]) {
        const [t0,v0] = points[i-1], [t1,v1] = points[i];
        const x = (time-t0)/(t1-t0), eased = x*x*(3-2*x);
        return v0+(v1-v0)*eased;
      }
      return 100;
    }
    function tick(now) {
      const elapsed = Math.min(now-start,4800), value = valueAt(elapsed);
      fill.style.width = `${value}%`; star.style.left = `${value}%`;
      progress.setAttribute('aria-valuenow',String(Math.round(value)));
      if (elapsed >= 2260) slogan.classList.add('switched');
      if (elapsed >= 3900) status.textContent = '启动完成';
      if (elapsed >= 4350) { desktop.classList.add('show'); desktop.setAttribute('aria-hidden','false'); boot.classList.add('leave'); }
      if (elapsed < 4800) frame = requestAnimationFrame(tick);
    }
    function replay() {
      cancelAnimationFrame(frame); start = 0; fill.style.width = '0%'; star.style.left = '0%';
      progress.setAttribute('aria-valuenow','0'); slogan.classList.remove('switched'); status.textContent = '系统启动中……';
      desktop.classList.remove('show'); desktop.setAttribute('aria-hidden','true'); boot.classList.remove('leave');
      frame = requestAnimationFrame((now) => { start = now; tick(now); });
    }
    document.getElementById('replay').addEventListener('click', replay);
    replay();
  </script>
</body>
</html>
