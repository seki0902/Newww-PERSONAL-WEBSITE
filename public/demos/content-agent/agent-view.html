<div class="agent-wrap">
  <header class="agent-head">
    <div><div class="page-title">Agent 聊天</div><div class="page-sub">本地预设对话：选题、核验、写稿、审核、数字人</div></div>
    <div class="agent-head-actions"><span class="agent-session">本地会话</span><button class="btn-s" id="agentNewSession" type="button">新会话</button><button class="btn-s" id="agentBack" type="button">返回工作台</button></div>
  </header>
  <div class="agent-activity" id="agentActivity" aria-live="polite"></div>
  <main class="agent-main"><div class="agent-columns">
    <section class="agent-chat">
      <div class="agent-log" id="agentLog" aria-live="polite"><div class="agent-row agent-row-assistant"><div class="agent-bubble agent-bubble-assistant">你好，我可以演示从选题到数字人任务的完整内容流程。选择下方一条预设消息开始。</div></div></div>
      <div class="agent-composer" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-s agent-preset" type="button" data-step="topic">开始选题</button>
        <button class="btn-s agent-preset" type="button" data-step="draft">继续写稿</button>
        <button class="btn-s agent-preset" type="button" data-step="final">审核并生成</button>
      </div>
      <div class="agent-hint" id="agentHint" role="status" aria-live="polite">选择预设消息推进本地演示。</div>
      <form class="agent-composer" id="agentForm" autocomplete="off"><textarea id="agentInput" rows="1" placeholder="也可以输入一句话，例如：帮我检查开头"></textarea><button class="btn-p" type="submit">发送</button></form>
      <div class="demo-result" id="agent-demo-result" data-testid="agent-demo-result" hidden></div>
    </section>
    <aside class="agent-side" id="agentSide">
      <div class="agent-side-head"><span>当前任务</span></div><div class="agent-side-body" id="agentSideBody"><div class="agent-side-empty">发起选题后，这里会显示阶段与稿件。</div></div>
      <div class="agent-side-head agent-config-head"><span>生成视频任务</span></div><div class="agent-side-body" id="agentTasksBody"><div class="agent-side-empty">尚无演示任务</div></div>
      <div class="agent-side-head agent-config-head"><span>演示设置</span></div><div class="agent-config"><div class="agent-config-note">当前页面使用本地虚构数据。提交的视频任务和预览均为流程模拟，不会访问在线模型或视频服务。</div></div>
    </aside>
  </div></main>
</div>
