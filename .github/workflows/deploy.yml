name: Deploy Portfolio (ECS + Docker + Aliyun ACR)

# 设计约束：镜像只在 GitHub Actions 构建，ECS 只 pull & run（严禁在 ECS 上 build）。
on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: portfolio-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/seki-portfolio' }}
  # 阿里云容器镜像服务（杭州个人版）；同地域可把 ACR_PULL_REGISTRY 换成 VPC 地址。
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY || 'crpi-nqwu6u57qjindq7p.cn-hangzhou.personal.cr.aliyuncs.com' }}
  ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY || 'crpi-nqwu6u57qjindq7p.cn-hangzhou.personal.cr.aliyuncs.com' }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY || 'touhou-trpg/seki-portfolio' }}
  APP_CONTAINER: seki-portfolio-app

jobs:
  # ---------- 1. 质量门禁：lint + 类型 + 单元测试 + 浏览器 E2E ----------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seki
          POSTGRES_PASSWORD: seki
          POSTGRES_DB: seki_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seki -d seki_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://seki:seki@127.0.0.1:5432/seki_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E against local build + Postgres
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------- 2. 构建镜像并推送到 ACR ----------
  build-and-push:
    needs: [verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.pull_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          echo "pull_image=${ACR_PULL_REGISTRY}/${ACR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # ACR 个人版不支持 buildx 的 OCI 证明清单，必须关闭 provenance / SBOM。
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 3. 部署到 ECS（scp compose + docker compose pull/up，不在 ECS 构建）----------
  deploy:
    needs: [build-and-push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose file to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "docker-compose.prod.yml"
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true
          timeout: 60s

      - name: Deploy on ECS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DATABASE_URL_B64: ${{ secrets.DATABASE_URL_B64 }}
          ADMIN_TOKEN_B64: ${{ secrets.ADMIN_TOKEN_B64 }}
          ACR_PULL_REGISTRY: ${{ env.ACR_PULL_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          APP_CONTAINER: ${{ env.APP_CONTAINER }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 20m
          envs: APP_IMAGE,DATABASE_URL_B64,ADMIN_TOKEN_B64,ACR_PULL_REGISTRY,ACR_USERNAME,ACR_PASSWORD,DEPLOY_DIR,APP_CONTAINER
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f docker-compose.prod.yml

            if [ -n "${ACR_PASSWORD:-}" ]; then
              echo "$ACR_PASSWORD" | docker login "$ACR_PULL_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            fi

            # 用 python 安全写入 .env（避免密码中的特殊字符被 sed 破坏）
            python3 - "$APP_IMAGE" "$DATABASE_URL_B64" "$ADMIN_TOKEN_B64" <<'PY'
            import base64, os, sys
            image, db_b64, token_b64 = sys.argv[1], sys.argv[2], sys.argv[3]
            values = {
              "APP_IMAGE": image,
              "DATABASE_URL": base64.b64decode(db_b64).decode() if db_b64 else "",
              "ADMIN_TOKEN": base64.b64decode(token_b64).decode() if token_b64 else "",
            }
            path = ".env"
            existing = {}
            if os.path.exists(path):
              for line in open(path, encoding="utf-8"):
                line = line.strip()
                if line and not line.startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  existing[key] = value
            existing.update(values)
            with open(path, "w", encoding="utf-8") as fh:
              for key, value in existing.items():
                fh.write(f"{key}={value}\n")
            os.chmod(path, 0o600)
            PY

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            docker compose -f docker-compose.prod.yml ps

            for i in $(seq 1 24); do
              if curl -fsS "http://127.0.0.1:8080/api/health" >/dev/null; then
                curl -fsS "http://127.0.0.1:8080/api/health"
                echo ""
                echo "部署成功：$APP_IMAGE"
                exit 0
              fi
              echo "等待健康检查… ($i/24)"
              sleep 5
            done
            echo "健康检查失败，输出最近日志："
            docker logs --tail 80 "$APP_CONTAINER" || true
            exit 1
