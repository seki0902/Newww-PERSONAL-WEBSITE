name: Deploy Portfolio (Cloudflare Pages + Workers KV)

# 设计：站点 = Cloudflare Pages（静态 SPA + Pages Functions API），素材 = Workers KV。
# 没有 ECS、没有构建服务器、不需要备案；PR 只跑质量门禁，master 合并后自动发布。
on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: portfolio-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'seki-portfolio' }}

jobs:
  # ---------- 1. 质量门禁：lint + 类型 + 单测 + 浏览器 E2E ----------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seki
          POSTGRES_PASSWORD: seki
          POSTGRES_DB: seki_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seki -d seki_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://seki:seki@127.0.0.1:5432/seki_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------- 2. 发布到 Cloudflare Pages（静态产物 + Pages Functions）----------
  deploy:
    needs: [verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=${{ github.ref_name }}
      - name: Smoke test (health + 一个素材)
        run: |
          BASE="${{ vars.PUBLIC_BASE_URL || format('https://{0}.pages.dev', env.CF_PAGES_PROJECT) }}"
          echo "public: $BASE"
          curl -fsS "$BASE/api/health" | head -c 300; echo
          curl -fsS -o /dev/null -w 'spa: %{http_code}\n' "$BASE/"
